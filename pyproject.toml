[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdna-batchaudit"
version = "0.1.0"
description = "Leakage-controlled, streaming audit of cfDNA fragmentomics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "pyarrow>=14", "scipy>=1.11", "scikit-learn>=1.4,<2", "statsmodels>=0.14,<0.16", "matplotlib>=3.8", "requests>=2.31", "PyYAML>=6", "tabulate>=0.9", "openpyxl>=3.1,<4", "pyreadr>=0.5.8,<1"]

[project.optional-dependencies]
gpu = ["torch>=2.3", "xgboost>=2,<4", "lightgbm>=4,<5"]
audit = ["umap-learn>=0.5"]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

